name: Publish templates to GitHub Pages

# GitHub Pages serves the gh-pages branch. This keeps it in sync with the
# working branch so every push updates the live site.
on:
  push:
    branches: [main, claude/eloquent-edison-tc6sa6]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update gh-pages branch
        run: git push --force origin HEAD:refs/heads/gh-pages
